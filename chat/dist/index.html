  <body>
    <!--
      THESIS: A chat panel that reads as part of the edit bay, not a web chat. The agent "rolls" like a take: a tally
      light, a playhead on a ruler, run time as ticking timecode, steps that land on a rail like clips on a track.
      OWN-WORLD: Moonlit (near-black #08090c to #1a1d22, fog ink #d6d8dc, one warm window accent #ead9ae, fog, hairline rain, grain; mid radii, fog edges, no glow),
      red only for live work, SF Pro 13.5px prose, SF Mono for timecode only, Fusion-tinted node chips.
      STORY: The editor sees where the playhead is, asks in editor language, approves each edit in one keystroke,
      and reads back exactly which nodes and keys changed.
      FIRST VIEWPORT: 44px header (thread, new, settings), one context line (tally, timecode, clip; details in a
      popover) over a hairline ruler, the conversation, and a roomy composer with an icon-only toolbar.
      FINISH: unreviewed and undocumented is unfinished; DESIGN.md describes the result.
    -->
